server:
    port: 5000

telegram-bot:
    bot-name: 'Athlon'
    bot-token: ${ATHLON_BOT_TOKEN}

spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
    liquibase:
        change-log: classpath:db/changelog/db.changelog-master.yml
        enabled: true