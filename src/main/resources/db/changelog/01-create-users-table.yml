databaseChangeLog:
  - changeSet:
      id: 1-users-table-creation
      author: liquibase-athlon-init
      comment: Create USERS table in ATHLON schema
      changes:
        - createTable:
            schemaName: ATHLON
            tableName: USERS
            columns:
              - column:
                  name: id
                  type: VARCHAR(36 CHAR)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: external_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: login
                  type: VARCHAR(64 CHAR)
              - column:
                  name: username
                  type: VARCHAR(32 CHAR)
                  constraints:
                    nullable: false
              - column:
                  name: birthdate
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: banned
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false