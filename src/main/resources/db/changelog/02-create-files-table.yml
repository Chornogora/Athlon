databaseChangeLog:
  - changeSet:
      id: 3-files-table-creation
      author: liquibase-athlon-init
      comment: Create FILES table in ATHLON schema with foreign key to USERS
      changes:
        - createTable:
            schemaName: ATHLON
            tableName: FILES
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36 CHAR)
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(64 CHAR)
                  constraints:
                    nullable: false
              - column:
                  name: external_file_id
                  type: VARCHAR(255 CHAR)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: upload_date
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: ATHLON
            baseTableName: FILES
            baseColumnNames: user_id
            referencedTableSchemaName: ATHLON
            referencedTableName: USERS
            referencedColumnNames: id
            constraintName: fk_files_user_id
            onDelete: CASCADE